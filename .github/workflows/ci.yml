name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Unit tests, then the integration tests on a throwaway Oracle XE 11g.
      - name: Build, unit and integration tests
        run: ./mvnw -B -ntp verify -Pit -Dplsql.it.image=gvenzl/oracle-xe:11-slim
