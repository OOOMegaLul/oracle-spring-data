name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit tests, then the integration tests on a throwaway Oracle XE 11g.
      - name: Build, unit and integration tests
        shell: bash
        run: ./mvnw -B -ntp verify -Pit -Dplsql.it.image=gvenzl/oracle-xe:11-slim 2>&1 | tee build.log

      # The reason for a failure as an annotation: shown on the run page and readable
      # through the public API, unlike the raw log.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'EOF'
          import re
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          key = re.compile(r'\[ERROR\]|Tests run:.*(Failures|Errors): [1-9]|Caused by|Exception|expected|but was|ORA-\d')
          picked = [l for l in lines if key.search(l)][:80] or lines[-80:]
          text = '\n'.join(picked)[:60000]
          esc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Build failed::' + esc)
          EOF

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore
