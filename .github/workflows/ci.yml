name: ci

on:
  push:
  pull_request:

jobs:
  # Integration tests on Oracle 11g (the main target), 21c and 23ai: from 18c on the dictionary
  # describes PL/SQL types differently, and the library reads both.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image: ['gvenzl/oracle-xe:11-slim', 'gvenzl/oracle-xe:21-slim', 'gvenzl/oracle-free:23-slim']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Unit tests, then the integration tests on a throwaway Oracle XE 11g.
      - name: Build, unit and integration tests
        shell: bash
        run: ./mvnw -B -ntp verify -Pit -Dplsql.it.image=${{ matrix.image }} 2>&1 | tee build.log

      # The reason for a failure as an annotation: shown on the run page and readable
      # through the public API, unlike the raw log.
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          python3 - <<'EOF'
          import re
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          key = re.compile(r'\[ERROR\]|Tests run:.*(Failures|Errors): [1-9]|Caused by|Exception|expected|but was|ORA-\d')
          picked = [l for l in lines if key.search(l)][:80] or lines[-80:]
          text = '\n'.join(picked)[:60000]
          esc = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Build failed::' + esc)
          EOF

      # Test times as a notice on the run page, also readable through the public API: a slow
      # build shows where the time went without the raw log (0.2.0 once took 16 minutes).
      - name: Report timings
        if: success()
        shell: bash
        run: |
          python3 - <<'EOF'
          import re
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          classes = []
          for l in lines:
              m = re.search(r'Time elapsed: ([0-9.]+) s.* in (dev\.plsql\.\S+)', l)
              if m:
                  classes.append((float(m.group(1)), m.group(2).rsplit('.', 1)[-1]))
          classes.sort(reverse=True)
          text = [f'{t:7.1f} s  {c}' for t, c in classes[:8]]
          text += [l.replace('[INFO] ', '') for l in lines if 'Total time' in l]
          print('::notice title=Timings::' + '%0A'.join(text))
          EOF

      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ strategy.job-index }}
          path: |
            build.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

  # The library also targets Spring Framework 6.2 (Spring Boot 3.5): unit tests against it, so
  # that nothing from Spring 7 or Boot 4 slips into the code. Integration tests run in "build".
  boot3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit tests on Spring Boot 3.5
        shell: bash
        run: ./mvnw -B -ntp test -Dspring-boot.version=3.5.6
