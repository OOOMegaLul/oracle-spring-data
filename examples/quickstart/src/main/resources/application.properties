# Подключение к базе: поменяйте на свои.
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/ORCL
spring.datasource.username=hr_demo
spring.datasource.password=hr_demo

# Oracle 11.2 не знает часовой пояс Etc/UTC (он по умолчанию в Docker и на серверах):
# без этой строки вход падает с ORA-01882.
spring.datasource.hikari.data-source-properties.oracle.jdbc.timezoneAsRegion=false

# Соединения из пула без автоматической фиксации: одиночный вызов вне @Transactional
# библиотека фиксирует сама, а в @Transactional фиксирует Spring в конце.
spring.datasource.hikari.auto-commit=false

# Сгенерированные блоки PL/SQL и время вызовов в логе (для знакомства; в работе можно убрать).
logging.level.dev.plsql.spring=DEBUG
